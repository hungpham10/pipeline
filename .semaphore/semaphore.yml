version: v1.0
name: Run Endpoint Script Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Build models
    dependencies: []
    task:
      secrets:
        - name: simulator-secret
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
        containers:
          - name: main
            image: 'ghcr.io/hungpham10/algorithm:latest'
      jobs:
        - name: Perform simulators
          commands:
            - /app/endpoint.sh /app/aio /sql simulate --model trend-following
