version: v1.0
name: Run in Docker
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Train model
    task:
      jobs:
        - name: Train model
          commands:
            - echo "Hello from my 'main' container"
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
        containers:
          - name: main
            image: 'ghcr.io/hungpham10/algorithm:latest'
            env_vars:
              - name: DISABLE_AUTO_INIT_DATABASE
                value: 'true'
              - name: COMMAND
                value: simulator
