version: v1.0
name: Run Endpoint Script Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Build models
    dependencies: []
    task:
      secrets:
        - name: simulator-secret
      jobs:
        - name: 'Job #1'
          commands:
            - 'wget --no-check-certificate -O backend_1.0.27-1_amd64.deb https://github.com/hungpham10/algorithm/releases/download/v1.0.27/backend_1.0.27-1_amd64.deb'
            - apt install ./backend_1.0.27-1_amd64.deb
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
        containers:
          - name: main
            image: 'ghcr.io/hungpham10/algorithm:1.0.27'
