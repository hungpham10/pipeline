version: v1.0
name: Run Endpoint Script Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Build models
    dependencies: []
    task:
      secrets:
        - name: simulator-secret
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
      jobs:
        - name: 'Job #1'
          commands:
            - 'wget https://github.com/hungpham10/algorithm/releases/download/v1.0.27/algorithm_1.0.27_amd64.deb'
            - sudo apt update
            - sudo apt install ./algorithm_1.0.27_amd64.deb
