version: v1.0
name: Run Endpoint Script Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
blocks:
  - name: Build models
    dependencies: []
    task:
      secrets:
        - name: simulator-secret
      agent:
        machine:
          type: e1-standard-2
          os_image: ubuntu2004
      jobs:
        - name: 'Job #1'
          commands:
            - 'curl -LkO https://github.com/hungpham10/algorithm/releases/download/v${VERSION}/backend_${VERSION}-1_amd64.deb'
            - sudo apt update
            - 'sudo apt install ./algorithm_${VERSION}_amd64.deb'
      env_vars:
        - name: VERSION
          value: 1.0.27
